<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#655cf0"><title>증권투자권유자문인력 모의고사</title><style>
:root{--purple:#655cf0;--ink:#171923;--muted:#747887;--bg:#f5f6fb;--line:#e7e8f0;--pink:#ffe3e5;--red:#d94450;--green:#d2f8e8;--greenink:#167c5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}button,select,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:18px 14px 100px}.hero{background:#fff;border-radius:24px;padding:22px 20px;box-shadow:0 8px 28px #24274a0b;margin-bottom:14px}.eyebrow{font-size:12px;font-weight:800;color:var(--purple);letter-spacing:.04em}.hero h1{font-size:24px;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5}.stats{display:flex;gap:8px;margin-top:16px}.stat{background:#f2f1ff;padding:10px 12px;border-radius:14px;flex:1;font-size:13px}.stat b{display:block;font-size:19px;color:var(--purple)}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.toolbar select,.toolbar input{min-width:0;width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink)}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab,.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750;white-space:nowrap}.tab{background:#fff;color:#646879}.tab.active,.btn.primary{background:var(--purple);color:white}.btn.soft{background:#eeedff;color:var(--purple)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 5px 20px #24274a08}.qhead{padding:15px 17px;background:#f0efff;display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{font-size:12px;font-weight:800;border-radius:99px;padding:6px 10px;background:#dedcff;color:#5148dc}.qbody{padding:20px 17px}.qtext{font-size:17px;line-height:1.65;font-weight:750;white-space:normal;margin:0 0 18px}.options{display:grid;gap:10px}.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff;line-height:1.55;color:var(--ink)}.opt .num{flex:0 0 27px;height:27px;border-radius:50%;background:#f0f1f7;display:grid;place-items:center;font-size:13px;font-weight:800}.opt.selected{border:2px solid var(--purple);padding:12px;background:#f7f6ff}.opt.correct{background:var(--green);border-color:#9be8c9}.opt.wrong{background:var(--pink);border-color:#ffc3c8}.opt.correct .num{background:var(--greenink);color:white}.opt.wrong .num{background:var(--red);color:white}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.btn{cursor:pointer}.btn:disabled{opacity:.45}.feedback{margin-top:14px;padding:14px;border-radius:15px;line-height:1.6;background:#f7f7fb;font-size:14px}.feedback.good{background:var(--green);color:var(--greenink)}.feedback.bad{background:var(--pink);color:#9c2934}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}.progress{height:7px;background:#e7e8f0;border-radius:9px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--purple);width:0}.panel{background:white;border-radius:20px;padding:18px;margin-top:14px}.listitem{padding:14px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.listitem h3{font-size:15px;line-height:1.5;margin:0 0 8px}.mini{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.bottominner{max-width:760px;margin:auto;display:flex;gap:8px}.bottom button{flex:1}.answerlabel{font-weight:800}.smallnote{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}@media(min-width:600px){.wrap{padding-top:28px}.qbody{padding:24px}.qtext{font-size:19px}}
</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">EXAM PRACTICE · ORIGINAL PDF BASED</div><h1>증권투자권유자문인력<br>모의고사 풀이</h1><div class="sub">제공한 모의고사 1·2·3회에서 문제와 보기를 추출했어요. 정답은 별도 정답표를 연결했으며, 제공 파일에 없는 해설은 임의로 만들지 않았습니다.</div><div class="stats"><div class="stat"><b id="totalStat">300</b>전체 문항</div><div class="stat"><b id="wrongStat">0</b>오답노트</div><div class="stat"><b id="doneStat">0</b>풀이 완료</div></div></section><div class="toolbar"><select id="exam"><option value="all">전체 모의고사</option><option value="1">모의고사 1회</option><option value="2">모의고사 2회</option><option value="3">모의고사 3회</option></select><select id="mode"><option value="all">전체 문제</option><option value="unanswered">안 푼 문제</option><option value="wrong">오답노트 문제</option><option value="done">풀이 완료 문제</option></select></div><div class="tabs"><button class="tab active" data-view="quiz">문제 풀기</button><button class="tab" data-view="wrong">오답노트 <span id="wrongBadge">0</span></button><button class="tab" data-view="results">풀이 기록</button></div><div id="quizView"><div class="progress"><span id="progressbar"></span></div><div class="sub" id="position"></div><section class="card"><div class="qhead"><span class="pill" id="examPill">모의고사 1회</span><span class="mini" id="questionNo">1 / 100</span></div><div class="qbody"><p class="qtext" id="qtext"></p><div class="options" id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button class="btn soft" id="checkBtn">정답 확인</button><button class="btn primary" id="nextBtn">다음 문제 →</button></div><div class="nav"><button class="btn soft" id="prevBtn">← 이전</button><button class="btn soft" id="markBtn">☆ 오답노트 저장</button></div></div></section><div class="smallnote">※ 문제와 선택지는 업로드된 텍스트 추출본 기준입니다. 원본 PDF 추출 과정에서 일부 줄바꿈이나 기호가 달라졌을 수 있습니다. 정답표 자체에도 오류 가능성이 명시되어 있어, 의심 문항은 원본 자료로 확인해 주세요.</div></div><div id="wrongView" class="panel hidden"></div><div id="resultsView" class="panel hidden"></div></main><div class="bottom"><div class="bottominner"><button class="btn soft" id="shuffleBtn">문제 순서 섞기</button><button class="btn primary" id="examStartBtn">선택 회차 처음부터</button></div></div><script>
const QUESTIONS=[{"id":"1-1","exam":1,"num":1,"question":"다음 중 경기변동의 원인에 대한 설명으로 가장 거리가 먼 것은?","options":["케인즈에 따르면 투자는 기업가의 미래수익에 대한 기대를 반영하는데, 기대는 기업가의 동물적 감각에 크게 의존한다.","프리드만을 중심으로 한 통화학파의 경우 통화당국의 자의적인 통화량 조절 때문에 경기변동이 발생한다고 주장했다.","루카스 등은 시장에서 완전한 정보를 가지더라도 경제주체들이 적응적 기대를 하기 때문에 시차에 의한 경기변동이 촉발된다고 주장하였다.","슘페터는 경제발전의 원인이 생산요소의 새로운 결합 or 기술혁신에 있다고 보았다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-2","exam":1,"num":2,"question":"다음 중 경기종합지수의 구성지표 중 선행지표로 가장 거리가 먼 것은?","options":["재고순환지표","경제심리지수","소비자물가지수변화율(서비스)","장단기금리차"],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-3","exam":1,"num":3,"question":"다음 자료를 참고하여 기업실사지수(BSI)를 계산하면? · 전체응답업체수 : 100 · 상승응답업체수 : 50 · 하락응답업체수 : 30 · 보합응답업체수 : 20","options":["20","50","120","150"],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-4","exam":1,"num":4,"question":"다음 중 GDP디플레이터에 대한 설명으로 틀린 것은?","options":["자동차 10대의 명목가격이 대당 2,000만 원, 불변가격이 대당 1,500만 원이라면 GDP 디플레이터 수치는 33(%)일 것이다.","명목 GDP를 실질 GDP로 나눈 비율이다.","국민경제 전체의 물가압력을 측정하는 지수이다.","명목 GDP를 당해가격 기준으로, 실질GDP를불변가격기준으로산출한다."],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-5","exam":1,"num":5,"question":"다음 중 통화지표에 대한 설명으로 가장 거리가 먼 것은?","options":["금융기관의 제도적 형태보다는 금융상품의유동성을기준으로구분되었다.","가장 넓은 범위의 통화를 L이라고 한다.","CD, RP, CMA, 표지어음 등은 M1에 속한다.","은행저축예금 및 MMDA도 M1에 포함된다고 할 수 있다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-6","exam":1,"num":6,"question":"다음 중 경기동향(확산)지수(DI)에 대한 설명으로 옳지 않은 것은?","options":["역사적 확산지수는 과거의 기준순환일을 추정하는 데만 이용된다.","당면적 경기확산지수는 현재의 경기국면 판단 및 향후 예측수단으로 이용된다.","DI의 월별변동폭이 심할 경우에는 누적 경기확산지수를 산출하여 보완적으로 사용한다.","0에서 200까지의 범위를 가지고 있으며, 100보다 크면 확장국면, 작으면 수축국면, 100이면 전환점으로 판단한다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-7","exam":1,"num":7,"question":"A기업에 대한 재무정보가 아래와 같을 때, 다음의 수익성 지표 중 가장 값이 작은 것은? · 총부채 : 100억 원 · 영업이익 : 10억 원 · 자기자본 : 80억 원 · 당기순이익 : 12억 원 · 매출액 : 200억 원","options":["총자본이익률","자기자본이익률","매출액영업이익률","매출액순이익률"],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-8","exam":1,"num":8,"question":"B기업의 자기자본이익률은 10%, 매출액순이익률은 5%, 자기자본은 10억 원일 때, B기업의 매출액은? (가장 가까운 근사치로 구하시오)","options":["5억 원","10억 원","20억 원","40억 원"],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-9","exam":1,"num":9,"question":"A기업의 현재 주가는 1,000원, 현재 배당금( )은 100원, 영구적인 배당성장률(g)은 5%일 때, Gordon의 항상성장모형에 따른 A기업 주주의 요구수익률은?","options":["15.0%","15.5%","16.0%","16.5%"],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-10","exam":1,"num":10,"question":"다음 중 주가배수모형에 대한 설명으로 가장 올바른 것은?","options":["보통주 한 주에 귀속되는 주당순자산가치가 실질적 가치를 정확히 반영하게 되면 PCR은 1이 된다.","이익이 발생하지 않아 수익성 평가가 어려운 신생, 벤처기업의 평가에 PBR을 많이 사용한다.","다른 조건이 동일하다고 할 때, 성장률이 낮고 자본비용이 높은 기업일수록 PER이 낮게 나타난다.","PSR은 주가를 주당 현금흐름으로 나눈 비율이다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-11","exam":1,"num":11,"question":"다음 중 EV/EBITDA 비율의 장점으로 가장 거리가 먼 것은?","options":["주가이익비율(PER)모형의 한계점을 보완하고 있다. 즉, 기업 자본구조를 감안한 평가방식이다.","회사 간 비교가능성이 높아 공시정보로서의 유용성이 크다.","추정방법이 단순하고, 분석기준이 널리 알려져 있다.","시가총액의 경우 분석기준 시점을 고려할 필요가 없다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-12","exam":1,"num":12,"question":"다음 중 기술적 분석에 대한 설명으로 가장 거리가 먼 것은?","options":["주가흐름 or 거래량 변화의 패턴 or 추세를 관찰하여 주가 변동을 예측한다.","국민경제, 산업, 기업의 순으로 분석이 이루어진다.","추세분석은 주가는 상당기간 동일한 방향성을 지속하려는 경향이 있다는 특성을 이용한 기법이다.","이론적인 검증이 어렵다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-13","exam":1,"num":13,"question":"다음 중 1개의 캔들차트가 아닌 것은?","options":["해머형","하락샅바형","유성형","먹구름형"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-14","exam":1,"num":14,"question":"다음 중 엘리어트 파동이론에 관한 설명으로 옳지 않은 것은?","options":["엘리어트가 발견한 가격변동의 법칙은 5번의 상승파동과 3번의 하락파동으로 구성된다는 것이다.","1번, 3번, 5번, b "exam":1,"num":57,"question":"다음 중 직무윤리의 구체적 내용에 대한 설명으로 잘못된 것은?","options":["투자정보를 제시할 때에는 사실과 의견을 명확히 구별해야 한다.","중요한 사실에 대해서는 정확하게 표시하고 설명해야 하며, 중요한 사실이 아니라면 투자자에게 설명을 생략할 수 있다.","고용계약 종료 후 고용기간 동안 자신이 생산한 지적재산물은 회사에 반납하고, 이에 대한 처분권한도 원칙적으로 회사에 있다.","직무윤리의 적용대상 행위는 업무시간 내에 한정되며, 업무시간 외의 행위에 대해서는 원칙적으로 제재할 수 없다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-58","exam":1,"num":58,"question":"다음 중 부당한 금품수수 및 제공의 금지에 대한 설명으로 가장 거리가 먼 것은?","options":["금융투자업자가 거래상대방에게 제공하거나 수령한 재산상 이익의 가액이 10억 원을 초과하는 즉시 인터넷 홈페이지를 통해 공시하여야 한다.","재산상 이익을 거래상대방에게 제공하는 경우 금융투자회사가 정한 금액을 초과하거나 전체 건수에 대해 금융투자회사는 그 제공에 대한 적정성을 평가하고 점검하여야 한다.","이사회에서 정한 기준금액을 초과하여 제공했다면 대표이사 또는 이사회에 보고 후 기록 유지한다.","거래상대방에게 재산상 이익의 제공 및 수령내역을 요청하려는 경우에는 소속 임직원의 동의를 반드시 받은 후 대표이사 명의의 서면으로 요청하여야 한다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-59","exam":1,"num":59,"question":"다음 중 설명의무에 대한 설명으로 가장 거리가 먼 것은?","options":["해외자산에 투자하는 집합투자증권의 투자권유 시에는 환율변동 위험, 투자대상 국가(지역)의 상황, 헤지 비율 등을 추가적으로 설명해야 한다.","일반투자자에게만 적용되며, 일반투자자의 이해수준에 따라 설명의 정도를 달리할 수 있으며, 설명 후에는 반드시 확인을 받아야 한다. 이때, 확인을 받지 않으면 설명의무 위반으로 손해배상책임을 질 수 있다.","설명했음에도 불구하고 투자자가 주요 손익 및 위험을 이해하지 못한다면 우선 거래 후 추가적인 투자자 교육을 통해 주지시키도록 한다.","투자자에게 손실보전 및 이익보장을 해주겠다는 식으로 설명해서는 아니 된다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-60","exam":1,"num":60,"question":"다음 중 적정성 원칙에 대한 설명으로 틀린 것은?","options":["최근에는 소비자가 고령인 경우 등 파생상품에 대한 이해도가 낮다고 판단되는 경우에는 숙련기간을 도입하고 별도의 확인절차를 거치게 한다.","해당 파생상품 등이 그 일반투자자에게 적정하지 아니하다고 판단되는 경우에는 그 사실을 알리고 서명, 기명날인, 녹취 등의 방법으로 확인을 받아야 한다.","파생상품 등에 대하여는 모든 투자자에게 평등한 투자권유준칙을 마련해야 한다.","금융투자업자가 일반투자자에게 파생상품 등을 판매하려고 하는 경우 면담, 질문 등을 통하여 그 일반투자자의 투자목적, 재산상황 및 투자경험 등의 정보를 파악하여야 한다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-61","exam":1,"num":61,"question":"사과씨는 주식형 펀드를 담당하고 있는 펀드매니저이다. 사과씨는 최근 매출된 주식형 펀드를 포함하여 4개의 주식형 펀드를 운용하고 있지만 시간과 노력의 대부분은 최근 매출한 1개의 신규펀드에 기울이고 있다. 나머지 3개의 펀드는 비교적 오래 전의 펀드에 대해서는 잔고가 적다는 것과, 이미 일정한 이율이 확보되었기에 그 내용을 변경하지 않고 있다. 신규 펀드에 대해서는 새롭게 입수한 투자정보에 기하여 적극적으로 포트폴리오의 내용을 교체하고 있지만 오래 전의 펀드에 대해서는 그렇게 하지 않고 있다. 이는 고객에 대한 어떤 의무를 위반한 것인가?","options":["모든 고객을 평등하게 취급할 의무","부당한 금품수수의 금지","고객정보의 누설 및 부당이용 금지","직위의 사적이용 금지"],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-62","exam":1,"num":62,"question":"다음 중 투자상담업무를 담당하고 있는 자가 고객에 대하여 투자권유 시 직무윤리기준을 위반하지 않은 것은?","options":["고객을 강하게 설득하기 위하여 필요하다면 투자성과가 어느 정도 보장된다는 취지로 설명하는 것도 가능하다.","중요한 사실이 아니라면 오히려 그것을 설명함으로 인하여 고객의 판단에 혼선을 줄 수 있는 사항은 설명을 생략할 수 있다.","정밀한 조사, 분석을 거치지는 않았지만 자신의 주관적인 예감에 확실히 수익성이 있다고 생각되는 투자상품이 있다면 그 상품을 위주로 권한다.","주가는 미래의 가치를 반영하는 것이므로 투자정보를 제시할 때에 현재의 객관적인 사실보다는 미래의 전망을 위주로 설명한다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-63","exam":1,"num":63,"question":"다음 중 내부통제의 주체 중 준법감시인의 역할에 대한 설명으로 가장 거리가 먼 것은?","options":["내부통제체제 구축 및 운영에 관한 기준을 정한다.","내부통제체제 및 내부통제기준의 적정성을 정기적으로 점검한다.","준법감시업무의 일부를 담당 임직원에게 위임할 수 있다.","내부통제기준의 미비사항이 발견될 경우 개선또는개정을요구할수있다."],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-64","exam":1,"num":64,"question":"개인정보처리자의 개인정보 보호 원칙에 대한 다음 설명 중 가장 거리가 먼 것은?","options":["개인정보의 처리방침 등 개인정보의처리에관한사항을공개하여야한다.","개인정보는 정확한 정보를 필요로 하므로, 익명처리를 하여서는 안 된다.","개인정보의 처리목적에 필요한 범위에서 적합하게 개인정보를 처리하여야 하며, 그 목적 외의 용도로 활용해서는 안 된다.","정보주체의 사생활 침해를 최소화하는 방법으로 개인정보를 처리하여야 한다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-65","exam":1,"num":65,"question":"다음 중 개인정보처리자가 개인정보를 수집할 수 있는 경우로 가장 거리가 먼 것은?","options":["정보주체의 동의를 받은 경우","공공기관이 법령 등에서 정하는 소관 업무의 수행을 위해 불가피한 경우","법률에 특별한 규정이 있는 경우","정보주체가 의식이 없는 경우로 정보처리자의 audqorgl 이익을 위한 경우"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"1-66","exam":1,"num":66,"question":"다음 중 자본시장법상 증권에 대한 설명으로 바르지 않은 것은?","options":["증권의 종류는 채무증권, 지분증권, 수익증권, 증권예탁증권, 투자계약증권, 파생결합증권이 있다.","채무증권은 국채, 지방채, 사채 등 지급청구권을 나타내는 것이다.","지분증권은 주식, 신주인수권 등 출자지분을 나타내는 R)이 높다면 주당순이익은 평균수준인데 주가가 높아서인 경우와 주가는 평균수준인데 주당순이익이 너무 낮은 경우 두 가지로 볼 수 있는데 전자는 기업의 성장성을 높게 보는 것이고, 후자는 기업의 수익성이 악화되고 있다고 판단할 수 있다.","주당순이익이 크면 클수록 주식의 가격이 높은 것이 보통이다."],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-10","exam":2,"num":10,"question":"다음 중 PBR이 정확히 1이 안 되는 이유로 가장 거리가 먼 것은?","options":["주가는 미래 지향적인 반면 주당순자산은 역사적 취득원가에 준하여 과거 지향적이다.","자산이나 부채의 장부가액은 일정한 회계관습에 의하여 제약을 받을 수 있다.","주가는 기업을 총체적으로 반영한 것이지만, BPS는 수많은 개별자산의 합에서 부채를 차감한 것에 불과하다.","회사의 개별자산 평가 시 계산의 오류로 인해 일정범위의 오차가 발생한다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-11","exam":2,"num":11,"question":"정석주식회사의 자산의 장부가치가 200억 원이고, 발행주식수는 100만 주이며, 과거평균 PBR은 2이다. 정석주식회사의 주가는 얼마인가?","options":["10,000원","20,000원","30,000원","40,000원"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-12","exam":2,"num":12,"question":"다음 중 기술적 분석의 종류에 대한 설명으로 가장 거리가 먼 것은?","options":["주가의 추세선 이탈현상이 발생할 때는 새로운 추세선 예측이 중요하다.","일반적으로 추세순응전략은 단기적으로, 역추세전략은 장기적으로 사용한다.","패턴분석은 시세의 천정권이나 바닥권에서 일어나는 전형적인 유형을 분석함으로써 주가흐름의 전환시점을 포착한다.","지표분석에 활용되는 지표는 일정 공식으로 만들어 표준화한 것으로 항상 우수한 결과가 나온다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-13","exam":2,"num":13,"question":"다음은 기술적 분석의 이론에 대한 설명이다. 틀린 것은?","options":["다우이론에 따르면 기술적 분석가들이 가장 높은 수익을 올릴 수 있는 시기는 강세2국면이다.","다우이론을 활용한 그랜빌의 투자전략에 의하면 강세3국면에서는 적극 매도, 약세3국면에서는 적극 매수하는 전략을 쓴다.","엘리어트 파동이론에 의하면 상승파동은 5개의 파동, 하락파동은 3개의 파동으로 구성되며, 충격파동은 5개의 소파동으로 구성되고, 시장과 반대방향으로 진행되며, 조정파동은 3개의 소파동으로 구성되며 시장과 같은 방향으로 진행된다.","사께다 전법에 의하면 매입, 매도하는 과정에 있어서의 휴식을 강조하는 것은 삼법이라 한다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-14","exam":2,"num":14,"question":"다음은 지표분석에 대한 내용이다. 틀린 것은?","options":["거래량 관련 지표에는 OBV, VR 등이 있다.","투자심리선은 상승일 수를, 등락주선(ADL)은 상승 및 하락종목 수를 활용한 지표이다.","비율지표에는 VR, 투자심리선, 스토캐스틱 등이 있다.","이동평균선 관련 지표에는 MACD, RSI 등이 있다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},  표준투자권유준칙에 따른 투자권유 유의사항에 대한 설명으로 가장 바르지 않은 것은?","options":["판매 임직원 등은 금융소비자와 계약을 체결한 경우 지체 없이 서면, 우편 or 전자우편, SMS 등의 방법으로 계약 서류를 제공하여야 한다.","임직원등은 투자자로부터 별도의 변경 요청이 없으면 투자자정보를 파악한 날로부터 12~24개월 동안 투자자정보가 변경되지 않은 것으로 간주할 수 있다.","회사는 청약의 철회를 접수한 날로부터 3영업일 이내에 이미 받은 금전등을 반환한다.","금융소비자는 위법계약에 대해 계약 체결일로부터 3년 이내에, 안 날로부터 1년 이내에 계약의 해지를 요구할 수 있다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-54","exam":2,"num":54,"question":"다음 중 직무윤리와 윤리경영에 대한 설명으로 가장 거리가 먼 것은?","options":["통상 기업윤리와 직무윤리는 혼용되어 사용되는 경우가 많다.","기업윤리는 경영전반에 걸쳐 조직의 모든 구성원들에게 요구되는 윤리적 행동을 강조하는 포괄적인 개념이다.","윤리경영은 기업윤리를 기업의 경영방식에 도입하는 것으로 간단히 정의될 수 있다.","기업윤리가 거시적인 개념이라면 직무윤리는 미시적인 개념이다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-55","exam":2,"num":55,"question":"다음 중 금융산업에서 직무윤리가 특히 중요한 이유가 아닌 것은?","options":["불특정 다수인 간의 비대면거래에 의하는 거래방식의 특성 때문에 규제가 필요하다.","금융산업에 종사하는 자는 전문성과 윤리성을 동시에 갖춰야 한다.","고객의 신뢰를 확보하는 것은 고객을 충성고객으로 만들 수 있는 것이므로 경쟁력을 확보 하는 것과 같다.","직무윤리는 고객을 보호하는 안전장치이다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-56","exam":2,"num":56,"question":"자본시장법 및 지배구조법에서 직무윤리의 역할에 대한 설명으로 가장 거리가 먼 것은?","options":["자본시장법은 포괄주의를 도입하였기에 법의 사각지대를 메워주는 직무윤리의 중요성이 증대하였다.","금융소비자보호를 위한 법적 규제의 수준이 높아짐에 따라 그에 상응하여 요구되는 윤리적 의무의 수준도 한층 높아졌다.","지배구조법은 금융투자회사가 윤리경영을 실천할 수 있도록 법적인 강제성을 부여한다.","자본시장법에서는 금융투자회사에 대한 종전의 업무영역과 취급 가능한 상품 등에 대한 규제를 대폭 강화함에 따라 금융소비자에 대한 고도의 윤리의식을 가지고 이를 준수하여 금융소비자의 신뢰를 확보함이 중요하다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-57","exam":2,"num":57,"question":"다음 중 직무윤리의 적용대상에 대한 설명으로 가장 바르지 않은 것은?","options":["직무윤리 및 직무윤리기준은 금융투자업의 경우 ‘금융투자업 종사자 내지 금융투자전문인력의 직무행위‘ 전반에 대하여 적용된다.","관련 전문자격증 보유자 뿐만 아니라, 이상의 자격을 갖기 이전에 관련 업무에 실질적으로 종사하는 자 등을 포함한다.","회사와 정식 고용관계에 있지 않은 자나 무보수로 일하는 자도 직무윤리를 준수하여야 한다.","아직 아무런 계약관계를 맺지 않은 잠재적 고객에 대해서는 적용대상에서 제외할 수 있다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-58","exam":2,"num":58,"question":"다음 중 직무윤리에 대한 설명으로 가장 거리가 먼 것은?","options":["직무윤리는 능동적 규제 장치로 자율적으로 시행하여 법규 등에 의한 타율적인 외부규제를 줄일 수 있다.","직무윤리는 자율적 준수라는 장점이 있지만 법규에 비해 강제수단이 미흡하다는 취약점이 있다.","직무윤리를 위반하는 경우 도덕적인 문제이므로 단순히 윤리적으로 잘못된 것에 그친다.","직무윤리는 시장에 종사하는 전체 투자상담 업무종사자의 직무행위를 적용대상으로 한다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-59","exam":2,"num":59,"question":"다음 중 금융투자업자의 주의의무에 대한 설명으로 가장 거리가 먼 것은?","options":["금융투자업자는 업무를 수행함에 있어 그 때마다의 구체적인 상황에서 전문가로서의 주의를 기울여야 한다.","‘전문가로서의’라는 것은 주의를 기울이는 정도와 수준에 있어서 일반인 이상의 당해 전문가집단에 평균적으로 요구되는 수준의 주의가 요구된다는 뜻이다.","‘주의’라는 것은 업무를 수행하는데 관련된 모든 요소에 기울여야 함을 뜻하며, 대가가 유상일 경우 요구된다.","금융투자업자가 고의 또는 과실로 인해 전문가로서의 주의의무를 다하지 못 했다면 법적 책임을 지게 된다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-60","exam":2,"num":60,"question":"금융투자업자가 소비자에게 사전에 금융위의 승인으로 손실부담을 책임지는 것이 가능한 경우로 가장 거리가 먼 것은?","options":["회사가 자신의 위법 행위 여부가 불명확한 경우 사적 화해의 수단으로 손실을 보상하는 행위 (증권투자의 자기책임원칙에 반하는 경우 포함)","회사의 위법행위로 인하여 회사가 손해를 배상하는 행위","분쟁조정에 따라 손실을 보상하는 행위","재판상의 화해절차에 따라 손해를 배상하는 행위"],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-61","exam":2,"num":61,"question":"투자상담업무종사자는 항상 직무에 대한 이론과 실무를 숙지하고 그 직무에 요구되는 전문능력을 유지하고 향상시켜야 한다. 이와 같은 표준윤리준칙을 무엇이라고 하는가?","options":["법규준수","자기혁신","품위유지","상호존중"],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-62","exam":2,"num":62,"question":"다음 중 영업점에 대한 내부통제에 대한 설명으로 가장 거리가 먼 것은?","options":["영업관리자는 영업점에서 1년 이상 근무한 요건이 요구된다.","영업관리자는 영업점장이 아닌 책임자이어야 한다.","영업관리자의 임기는 1년 이상으로 한다.","사이버룸은 고객보호를 위해 폐쇄형 형태로 설치되어야 한다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-63","exam":2,"num":63,"question":"다음은 분쟁조정제도에 대한 설명이다. 틀린 것은?","options":["분쟁조정제도 자체로서 구속력이 있다.","소송수행으로 인한 추가적인 비용부담 없이 최소한의 시간 내에 합리적으로 분쟁 처리가 가능한 장점이 있다.","양당사자의 합의가 도출되지 아니하면 분쟁처리가 지연될 수 있다.","금융투자협회, 금융감독원, 한국거래소 등에 분쟁조정제도가 있다."],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-64","exam":2,"num":64,"question":"다음 ( )안에 알맞은 것을 묶은 것은? 금융분쟁조정위원회의 경우 금융감독원장은 분쟁조정의 신청을 받은 날부터 ( )일 이내에 당사자 간에 합의가 이루어지지 아니한 때에는 지체 없이 이를 조정위원회에 회부하여야 한다. 조정위원회는 조정의 회부를 받으면 ( )일 이내에 이를 심의하여 조정안을 작성하여야 한다.","options":["30일, 30일","30일, 60일","60일, 30일","60일, 60일"],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-65","exam":2,"num":65,"question":"다음은 금융투자상품 관련 분쟁의 유형 중 무엇인가? 고객이 증권회사 or 선물회사 직원에게 금융투자상품의 관리를 맡기지 아니하였고 그 금융투자회사 직원이 매매주문을 받지 않았음에도 고객의 예탁자산으로 마음대로 매매한 경우에는 민사상 손해배상책임뿐만 아니라 직원의 처벌이 가해질 수 있음","options":["임의매매","일임매매","부당권유","주문관련"],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-66","exam":2,"num":66,"question":"금소법 상 방문(전화권유)판매 규제에 대한 다음 설명 중 가장 바르지 않은 것은?","options":["법은 원칙적으로 금융소비자로부터 계약 체결을 요청받지 아니하고 실시간 대화의 방법을 이용하는 행위를 부당권유행위로 규정하고 있다.","장외파생상품을 판매하기 위하여 전문금융소비자에게 사전연락을 할 수 있다.","고난도 금융투자상품 판매를 위해 일반금융소비자에게 사전연락을 할 수 없다.","전문금융소비자에게는 사모펀드를 판매하기 위하여 사전연락을 할 수 있다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-67","exam":2,"num":67,"question":"다음 중 자본시장법상 투자성을 판단할 때 투자금액 산정 시 제외항목으로 가장 올바른 것은?","options":["판매수수료","환매·해지수수료","각종 세금","채무불이행으로 인한 미지급액"],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-68","exam":2,"num":68,"question":"다음 중 인가 or 등록 절차에 대한 설명으로 적절하지 않은 것은?","options":["예비인가신청은 선택사항이다.","인가 시 금융위원회는 인가신청서를 접수한 날로부터 3개월 이내에 금융투자업 인가여부를 결정한다.","등록 시 금융위원회는 접수 후 2개월 이내에 등록여부를 결정하여 신청인에게 문서로 통지한다.","업무의 추가 or 인가·등록 단위의 변경이 불가능하다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-69","exam":2,"num":69,"question":"다음 중 자발적 전문투자자에 대한 다음 문장의 빈 칸에 들어갈 숫자를 순서대로 나열한 것은? · 자료제출일 전일 ( )억 원 이상의 금융투자상품 잔고를 보유한 법인 · 자료제출일 전일 5년 중 1년 이상 금융투자상품 잔고 ( )억 원 이상 이고, 직전연도 소득액 1억 원(부부합산 1.5억 원) 이상 or 자료제출일 전일의 총자산가액이 ( )억 원(거주주택 제외) 이상인 개인","options":["100, 0.5, 10","50, 5, 10","100, 1, 5","100, 0.5, 5"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-70","exam":2,"num":70,"question":"다음은 자본시장법상 건전성 규제 중 대주주와의 거래제한에 대한 설명이다. 적절하지 않은 것은?","options":["금융투자업자는 대주주가 발행한 증권을 소유할 수 없다.","금융투자업자는 그 계열회사가 발행한 주식, 채권 및 약속어음을 자기자본의 8%를 초과하여 소유할 수 없다.","대주주 및 대주주의 특수관계인은 금융투자업자로부터 신용공여를 받는 것이 금지된다.","금융투자업자는 계열회사 발행 증권을 한도 내에서 예외적으로 취득하는 경우 재적이사 1/2 이상의 찬성에 의한 이사회 결의를 거쳐야 한다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-71","exam":2,"num":71,"question":"다음은 자본시장법 및 금소법상 투자권유에 대한 설명이다. 적절하지 않은 것은?","options":["투자권유란 특정 투자자를 대상으로 금융투자상품의 매매, 투자자문계약·투자일임계약·신탁계약의 체결을 권유하는 것이다.","금융투자업자는 투자자가 일반투자자인지 전문투자자인지를 확인하여야 한다.","일반투자자의 투자목적 등에 비추어 적합하지 아니하다고 인정되는 투자권유를 하여서는 아니 되는 원칙을 적정성의 원칙이라 한다.","일반투자자에게 투자권유를 하는 경우 금융투자상품의 내용 등을 투자자가 이해할 수 있도록 설명하고, 이해하였음을 서명 등의 방법으로 확인 받아야 한다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-72","exam":2,"num":72,"question":"다음은 자본시장법상 증권의 발행공시제도에 대한 설명이다. 적절하지 않은 것은?","options":["간주모집도 증권신고서 제출대상에 해당한다.","모집이란 50인 이상의 투자자에게 새로 발행되는 증권의 청약을 권유하는 것이다.","청약권유상대방 제외 대상은 전문투자자, 회계법인, 신용평가업자, 공인회계사 등이다.","청약권유상대방 합산 대상은 과거 3개월 이내에 청약을 받은 자이다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-73","exam":2,"num":73,"question":"다음 중 자본시장법상 단기매매차익 반환제도에서 증선위가 미공개중요정보를 알 수 있는 자로 인정한 자로 가장 거리가 먼 자는?","options":["재무부서 직원","회계부서 직원","기획부서 직원","생산부서 직원"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-74","exam":2,"num":74,"question":"다음 중 증권신고서 효력발생에 영향이 없는 경우에 대한 설명으로 가장 거리가 먼 것은?","options":["초과배정수량을 변경하거나 초과배정옵션계약을 추가로 체결한 경우","사소한 문구수정 등 투자판단에 크게 영향을 미치지 않는 경미한 사항의 변경","당초 공모주식수의 80~100% 범위 내에서 변경하는 경우","공개매수의 대가로 신주를 발행하는 경우"],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-75","exam":2,"num":75,"question":"다음 중 자본시장법상 약관 관련 규정으로 바르지 않은 것은?","options":["금융투자업자는 약관을 제정 or 변경하고자 하는 경우에는 제정 or 변경 후 7일 이내 금융위 및 협회에 보고하여야 한다.","투자자의 권리나 의무에 중대한 영향을 미칠 우려가 있는 경우로서 대통령령으로 정하는 경우에는 약관의 제정 or 변경 전에 미리 금융위에 신고하여야 한다.","금융투자업자는 표준약관을 제정 or 변경하고자 하는 경우에는 미리 금융위원회에 신고하여야 한다.","전문투자자만을 대상으로 하는 표준약관을 제정 or 변경하는 경우에는 그 표준약관을 제정 or 변경한 후 7일 이내에 금융위원회에 보고하여야 한다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-76","exam":2,"num":76,"question":"다음 중 자본시장법상 시세조종행위 및 부정거래행위 규제에 대한 설명으로 가장 바르지 않은 것은?","options":["현·선연계 시세조종행위 및 현·현연계 시세조종행위 등 새로운 유형의 시세조종행위에 대해서도 법적 규제를 강화하였다.","시세조종금지에 위반한 자에 대해서는 1년 이상의 유기징역 or 그 위반행위로 얻은 이익 or 회피한 손실액의 3배 이상 5배 이하에 상당하는 벌금에 처할 수 있다.","자본시장법은 부정거래행위에 대해 법에 열거하여 규제하고 있다.","기존 시세조종금지(법 제176조) 및 부정거래행위 금지조항(법 제178조)은 매매유인이나 부당이득 목적 등이 없으면 규제하기 어려웠다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-77","exam":2,"num":77,"question":"다음 중 금융위 규정에 따른 적기시정조치 중 경영개선요구사항이 아닌 것은?","options":["고위험자산보유제한 및 처분","점포의 폐쇄, 통합 또는 신설제한","자회사의 정리","합병, 금융지주회사의 자회사로의 편입"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-78","exam":2,"num":78,"question":"다음 중 건전성 규제에 따른 자산건전성 분류에 대한 설명으로 가장 올바른 것은?","options":["금융투자업자는 매 분기마다 자산 및 부채에 대한 건전성을 1등급(양호) ~ 5등급(위험)의 5단계로 분류하여야 한다.","매 분기말 현재 “고정” 이하로 분류된 채권에 대해서는 적정한 회수예상가액을 선정하여야 한다.","“정상”으로 분류된 자산의 경우 대손충당금 적립의무가 없다.","정형화된 거래로 발생하는 미수금의 경우 대손충당금을 적립하여야 한다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-79","exam":2,"num":79,"question":"다음 중 금융투자회사의 경영실태평가 및 적기시정조치에 대한 설명으로 잘못된 것은?","options":["금융투자업자는 자본적정성 유지를 위해 순자본비율이 100% 이상 유지되도록 하여야 한다.","평가대상 금융투자업자에 대해 공통부문으로 단일 평가를 실시한다.","경영실태평가는 금융투자업자 본점, 해외 현지법인 및 해외지점을 대상으로 한다.","적기시정조치는 경영개선권고 → 경영개선요구 → 경영개선명령 순이다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-80","exam":2,"num":80,"question":"다음 중 금융투자업 규정상 금융투자업자가 투자광고에 포함시켜야 하는 사항으로 가장 거리가 먼 것은?","options":["타 기관 등으로부터 수상, 선정, 인증, 특허 등을 받은 내용을 표기하는 경우 당해 기관의 명칭, 수상 등의 시기 및 내용","과거의 재무상태 or 영업실적을 표기하는 경우 투자광고 시점 및 미래에 이와 다를 경우 차액의 일부를 보상한다는 내용","최소비용을 표기하는 경우 그 최대비용과 최대수익을 표기하는 경우 그 최소수익","통계수치나 도표 등을 인용하는 경우 해당 자료의 출처"],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-81","exam":2,"num":81,"question":"다음은 증권별 전매가능성 기준에 대한 설명이다. 잘못된 것은?","options":["지분증권의 경우에는 같은 종류의 증권이 모집 or 매출된 실적이 있거나 증권시장에 상장되는 경우 전매기준에 해당한다.","지분증권이 아닌 경우에는 50매 이상으로 발행된 경우 전매기준에 해당한다.","지분증권이 아닌 경우에는 발행 후 50매 미만으로 권면분할 되어 거래될 수 있는 경우 전매기준에 해당한다.","전환권, 신주인수권 등 증권이 부여된 권리의 목적이 되는 증권이 지분증권일 경우 전매기준에 해당한다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-82","exam":2,"num":82,"question":"다음 중 자본시장 조사업무규정상 조사의 주요 대상에서 가장 거리가 먼 것은?","options":["미공개정보 이용행위","상장법인의 공시의무 위반","내부자의 회사재산 횡령","시세조종 등 불공정거래행위"],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-83","exam":2,"num":83,"question":"다음 중 금융소비자 보호에 관한 법률상 금융상품의 유형에 대한 분류에 해당하지 않는 것은?","options":["예금성 상품","투자성 상품","보장성 상품","대부업 상품"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-84","exam":2,"num":84,"question":"다음 중 금융위 규정상 외환건전성에 대한 내용으로 가장 거리가 먼 것은?","options":["외국환업무취급 금융투자업자는 외화자산 및 외화부채를 통합하여 관리하여야 한다.","외국환포지션 중 종합포지션은 각 외국통화별 종합매입초과포지션의 합계액과 종합매각초과포지션의 합계액 중 큰 것으로 한다.","규정에서 정한 포지션 한도 외에 별도한도를 인정할 수 있는데, 그 인정기간은 2년 이내로 한다.","외국환업무취급 금융투자업자는 외국환포지션 한도 준수여부를 매 영업일 잔액을 기준으로 확인하고, 위반 시 3영업일 이내 감독원장에게 보고하여야 한다."],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-85","exam":2,"num":85,"question":"다음 중 금융위 규정상 투자권유대행인의 금지사항 및 고지사항에 대한 내용으로 가장 거리가 먼 것은?","options":["투자자에게 일정 한도 내에서 직·간접적인 재산상의 이익을 제공하면서 권유하는 행위","금융투자상품의 가치에 중대한 영향을 미치는 사항을 사전에 알면서 이를 투자자에게 알리지 않고 매매를 권유하는 행위","위탁계약을 체결한금융투자업자가 이미발행한주식의매매를권유하는행위","투자목적, 재산상황 및 투자경험 등을 감안하지 않고 지나치게 빈번하게 투자권유를 하는 행위"],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-86","exam":2,"num":86,"question":"다음 중 한국금융투자협회규정상 설명의무에 대한 설명으로 잘못된 것은?","options":["금융투자회사는 일반투자자가 공모의 방법으로 발행된 파생결합증권을 매매하고자 할 때 핵심설명서를 추가로 교부함에 따라 설명의무를 다했다고 할 수 있다.","금융투자회사는 일반투자자를 대상으로 투자권유를 하는 경우에는 해당 일반투자자가 서명 or 기명날인의 방법으로 설명서의 수령을 거부하는 경우를 제외하고는 투자설명사항을 로서 우리나라에서는 모든 법인에 있어서 강제된다.","이사회의 소집은 각 이사가 하는 것이 원칙이나 이사회의 결의로 소집이사를 따로 정한 때에는 다른 이사의 소집권은 배제된다.","이사의 보수는 그 액을 정관에서 정하지 않은 경우에는 주주총회가 하도록 하였다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-92","exam":2,"num":92,"question":"다음 중 상법상 신주의 발행절차에 대한 설명으로 잘못된 것은?","options":["회사 설립 후 신주를 발행하는 경우 신주의 발행 여부 및 구체적인 발행사항은 정관에 달리 규정이 없는 경우에는 이를 이사회가 결정한다.","신주를 배정받을 권리를 가진다는 뜻과 신주인수권을 양도할 수 있는 경우에는 그 뜻을 그 날의 2주 전에 공고하여야 한다.","회사에 대한 채무와 주금납입의무 간 상계는 불가능하다.","신주를 인수한 주식인수인은 납입기일의 다음 날로부터 주주로서의 권리·의무가 생긴다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-93","exam":2,"num":93,"question":"다음은 자본금의 감소에 대한 설명이다. 잘못된 것은?","options":["자본금 감소의 무효는 자본금 감소의 변경등기가 있는 날로부터 3개월 내에 소만으로 주장할 수 있다.","자본 감소는 주주의 이해관계에 중대한 영향을 미치는 사항이므로 주주총회의 특별결의가 있어야 한다.","자본감소의 효력은 자본 감소의 절차가 끝났을 때 발생한다.","자본 감소는 그 절차 or 내용에 하자가 있는 때에는 무효가 된다."],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-94","exam":2,"num":94,"question":"다음 중 주식양도에 대한 설명으로 틀린 것은?","options":["주식의 양도는 명의개서를 해야 회사에 대항 할 수 있다.","주식양도의 자유는 이사회의 승인을 요건으로 제한할 수 있다.","설립등기·주금납입기일 후 6개월이 경과하면 주권이 없어도 주식 양도가 가능하다.","권리주의 양도는 회사에 대하여 효력이 있다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-95","exam":2,"num":95,"question":"다음 중 합병에 대한 설명으로 옳지 않은 것은?","options":["합병은 회사가 소멸하는 경우 청산절차를 거치지 아니한다.","합병에 반대하는 주주는 주식매수청구권을 행사할 수 있다.","합병에 반대하는 채권자는 합병무효의 소를 제기할 수 있다.","이종회사 사이의 합병은 허용되지 않는다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-96","exam":2,"num":96,"question":"다음 중 세목별 납세의무 성립시기의 연결이 잘못된 것은?","options":["상속세 : 상속이 개시되는 때","증권거래세 : 당해 매매거래가 확정되는 때","가산세 : 가산할 국세의 납세의무가 성립하는 때","원천징수하는 소득세, 법인세 : 과세기간이 종료되는 때"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-97","exam":2,"num":97,"question":"다음 중 세법상 납세의무의 소멸에 관한 내용으로 가장 거리가 먼 것은?","options":["납부·충당 되거나 부과가 취소된 때 납세의무는 소멸한다.","국세부과의 제척기간이 만료되면 납세의무는 소멸한다.","국세징수권은 행사할 수 있을 때로부터 5년 이상 행사하지 않으면 소멸시효가 완성되고 납세의무도 소멸한다.","사기 등 부정행위로 국세를 환급 받은 경우 국세부과의 제척기간은 5년이다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-98","exam":2,"num":98,"question":"다음 중 상속세과세가액에 해당하지 않는 것은?","options":["생명 or 손해보험금, 피상속인 신탁재산, 퇴직금 or 퇴직수당 등 의제상속재산","상속인에게 5년 이내, 상속인 이외의 자에게 10년 이내에 증여한 재산","상속개시 전 1(2)년 이내 재산처분액 or 채무부담액이 재산종류별로 2(5)억 원 이상이고 용도가 불분명한 재산","상속재산가액"],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-99","exam":2,"num":99,"question":"다음 중 증권거래세법에 대한 내용으로 가장 거리가 먼 것은?","options":["국가 or 지방자치단체가 주권 등을 양도하는 경우에는 비과세 한다.","유가증권시장에서 양도되는 주권에 대해서는 농어촌특별세가 추가로 부가된다.","증권거래세는 거래징수로 국세의 원천징수와 같다.","한국예탁결제원 및 금융투자업자는 매 분기 분의 과세표준과 세액을 양도일이 속하는 분기의 말일부터 2개월 이내에 신고·납부하여야 한다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"2-100","exam":2,"num":100,"question":"다음 중 세법상 무조건 분리과세 대상 소득이 아닌 것은?","options":["법원보관금의 이자소득","비실명 이자·배당소득","직장공제회초과반환금","2,000만 원 이상의 금융소득"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-1","exam":3,"num":1,"question":"다음 중 개별기업 수익성에 영향을 주는 환율과 무역수지에 대한 설명으로 가장 올바른 것은?","options":["환율이 상승하면 수출비중이 높은 기업에게 유리하게 작용한다.","환율의 변동은 자국 생산제품의 국제경쟁력에는 미미한 영향을 준다.","자국통화가 평가절상되면 국내 제품가격을 상승시키나 인플레이션율에는 영향이 없다.","계속적인 무역수지 적자는 무역결제에 있어 타국통화보다 자국통화의 수요가 많은 것을 의미한다."],"answer":0,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-2","exam":3,"num":2,"question":"다음 경기순환 각 국면의 특성에 대한 내용으로 틀린 것은?","options":["경기회복이 시작되면 매출액이 상승하기 시작하고 이익에 대한 기대가 호전된다.","경기회복이 시작되기 전에는 매출액과 재고가 불황수준에 머물러 있고 초과설비능력이 존재하게 된다.","경기활황국면에서는 자본재산업에서 더 많은 고용기회와 수입의 기회를 제공하게 된다.","경기후퇴국면에서는 마지막으로 시설조업도가 최고의 상태가 된다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-3","exam":3,"num":3,"question":"다음 중 경기종합지수에 의한 예측방법의 내용으로 틀린 것은?","options":["경기와의 시차정도를 기준으로, 선행, 동행, 후행지표로분류하여작성한다.","구성지표들에 대하여 분기대비 증감률을 계산하고 이에 따라 가중치를 주어 가중평균하여 경기종합지수를 산출하게 된다.","가중평균된 증감률의 크기에 따라 경기변동의진폭까지도예측할수있다.","일반적으로 주식가격의 움직임이 경기의 움직임에 6개월 정도 선행하고 있는 것으로 나타난다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-4","exam":3,"num":4,"question":"다음 중 기업경기실사지수(BSI)에 관한 설명으로 가장 올바른 것은?","options":["장기 경기예측수단의 하나이다.","BSI가 75이면 호황국면이다.","BSI가 100이면 경기전환점을 의미한다.","BSI의 최고치는 100이다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-5","exam":3,"num":5,"question":"한 나라의 경기순환의 특징은 순환심도, 변동성, 공행성 등을 측정함으로써 알 수 있다. 이에 대한 설명으로 가장 거리가 먼 것은?","options":["순환심도는 경기변동을 잘 반영하는 변수를 채택하여 확장기와 수축기에 나타난 변동폭을 계산하면 된다.","변동성은 경기변수 증가율의 표준편차로 측정되는데, 변동성의 감소는 곧 안정성의 감소라고 해석할 수 있다.","공행성은 경제변수들이 서로 안정적인 관계를 가지고 일정한 방향으로 함께 움직이는 특성을 말하며 경기 전환점과의 시차 분석을 통해서 측정된다.","우리나라에서는 산업생산, 제조업가동률지수, 전력사용량 등이 경기순환과 큰 시차없이 동행하지만, 건축허가면적, 기계수주액 등은 경기에 다소 선행한다."],"answer":1,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-6","exam":3,"num":6,"question":"다음 중 경기확산지수(DI)에 대한 설명으로 가장 거리가 먼 것은?","options":["경기변동의 진폭이나 속도는 측정하지 않고 변화방향만 지수화 했다.","DI가 30일 때보다 60일 때 경기확장속도가 2배 빠르다고 할 수 없다.","DI가 50%가 넘으면 경기는 상승국면, 50% 미만이면 하강국면에 놓여있음을 나타내는 것이다.","경기전환점은 DI가 50%인 경우이며 40에서 50을 통과해 60이 되었다면 이는 경기정점을 지났다는 의미이다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-7","exam":3,"num":7,"question":"다음에서 설명하는 재무비율분석 지표는 무엇인가? 기업의 부채사용으로 인해 발생하는 이자가 미치는 영향을 살펴보기 위한 것으로 기업의 영업이익이 지급해야 할 이자비용의 몇 배에 해당하는가를 나타내는 비율","options":["유동비율","부채비율","고정(비유동)비율","이자보상비율"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-8","exam":3,"num":8,"question":"다음의 경우 자기자본이익률(ROE)은 얼마인가? · 자기자본 50억 원 · 매출액 200억 원 · 매출액순이익률 10%","options":["5%","10%","20%","40%"],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-9","exam":3,"num":9,"question":"다음 PSR에 대한 설명으로 틀린 것은?","options":["PER이나 PBR은 때로는 음수가 되어 의미가 없어질 수 있으나, PSR은 어떠한 기업에게도 적용할 수 있다.","본격적인 이익을 내지 못하는 신생기업이나 벤처기업의 주가평가에 주로 사용된다.","PER보다 변동성이 심한 단점이 있어, 가치평가 적용에 주의해야 한다.","매출액은 임의조정이 어려운 점이 고려되어 유의 있는 지표로 사용된다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-10","exam":3,"num":10,"question":"다음 EV/EBITDA 비율에 대한 설명으로 가장 거리가 먼 것은?","options":["EV는 주주가치와 채권자가치를 합계한 금액을 의미한다. 여기서의 채권자 가치란 순차입금을 의미한다.","EBITDA는 이자 및 세금, 상각비 차감 전 이익을 의미하며, 영업이익에 감가상각비, 무형자산상각비를 더한 금액으로 계산된다.","공모기업의 시장가치 추정 시 유사기업의 EV/EBITDA 비율로 추정할 수 있다.","일정기간의 시가총액 차이는 본 비율 계산 시 큰 고려대상이 아니다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-11","exam":3,"num":11,"question":"다음 중 주가배수모형에 의한 기업가치분석에서 주가수익비율(PER) 이용 시 유의점으로 가장 거리가 먼 것은?","options":["PER 계산식에서 분자의 주가자료는 분석시점의 현재주가를 사용하는 방법이 적절하다.","EPS를 계산할 때 특별손익을 제외한 경상이익이 이용될 수 있으며, 발행주식수에는 전환증권의 발행 등으로 희석되는 주식수를 포함시킬 수도 있다.","분모인 EPS는 회계이익으로서 기업마다 회계처리법이 상이할 경우 직접 비교에 무리가 따른다.","PER은 경기에 그다지 민감하게 반응하지 않아 사용에 이점이 있다."],"answer":3,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-12","exam":3,"num":12,"question":"다음은 기술적 분석의 장점이다. 틀린 것은?","options":["기술적 분석은 주가와 거래량에 모든 정보가 반영된다는 가정으로 분석한다.","기본적 분석의 시기의 불일치를 극복하고 주가변동의 패턴을 관찰하여 변동을 미리 예측할 수 있다.","이론이 다소 복잡하고 시간과 노력이 많이 드나, 이해하기는 쉽다.","한꺼번에 여러 주식의 가격변동 상황을 분석 예측할 수 있다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-13","exam":3,"num":13,"question":"다음 기술적 지표들에 대한 설명 중 바르지 않은 것은?","options":["투자심리선의 경우 최근 10일간 중 전일대비 상승일수를 누계하여 10으로 나누어 %로 나타낸다.","일반적으로 VR은 150%가 보통 수준이며, 450%를 초과하면 단기적으로 주가의 경계신호가 되고, 70% 이하이면 단기 매수시점으로 본다.","OBV선 작성 시 변동이 없는 날의 거래량은 차감한다.","등락주선(ADL)은 주가의 선행지표로 이해되고 있다."],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-14","exam":3,"num":14,"question":"다우 이론의 장기추세 진행과정 중 일반투자자들의 투매현상으로 주가는 하락하지만 시간이 지날수록 낙폭이 작아지는 국면은?","options":["분산국면","공포국면","침체국면","매집국면"],"answer":2,"explanation":"원본 정답표 기준. 별도 해설은 제공된 파일에서 확인되지 않아 추가하지 않았습니다."},{"id":"3-15","exam":3,"num":15,"question":"다음 중 주가가 반전모형이나 강화모형에서 완전히 벗어나서 예상했던 방향으로 급격한 변화를 보이는 과정에서 나타나는 경향이 있는 갭은?","options":["보통갭","돌파갭","계속갭","소멸갭"],"answer":2,"explanation":"원본 정답표 const $=id=>document.getElementById(id);const letters=['①','②','③','④'];let filtered=[],idx=0,selected=null,showAnswer=false,view='quiz';let responses=JSON.parse(localStorage.getItem('securitiesExamResponses')||'{}');let wrongs=JSON.parse(localStorage.getItem('securitiesExamWrongs')||'[]');let shuffled=false;let activeId=null;

function updateStats(){$('totalStat').textContent=QUESTIONS.length;$('wrongStat').textContent=wrongs.length;$('wrongBadge').textContent=wrongs.length;$('doneStat').textContent=Object.keys(responses).length}
function buildList(){let ex=$('exam').value,mode=$('mode').value;filtered=QUESTIONS.filter(q=>(ex==='all'||String(q.exam)===ex)&&(mode==='all'||(mode==='unanswered'&&!responses[q.id])||(mode==='done'&&responses[q.id])||(mode==='wrong'&&wrongs.includes(q.id))));if(shuffled)filtered=[...filtered].sort(()=>Math.random()-.5);idx=Math.min(idx,Math.max(0,filtered.length-1));render()}
function render(){if(view!=='quiz')return;let q=filtered[idx];if(!q){$('qtext').textContent='조건에 맞는 문제가 없어.';$('options').innerHTML='';$('feedback').classList.add('hidden');$('questionNo').textContent='0 / 0';$('position').textContent='필터를 바꾸거나 다른 회차를 선택해 주세요.';$('checkBtn').disabled=true;$('nextBtn').disabled=true;$('prevBtn').disabled=true;$('markBtn').disabled=true;$('progressbar').style.width='0%';return} $('checkBtn').disabled=false;$('nextBtn').disabled=false;$('prevBtn').disabled=idx===0;$('markBtn').disabled=false;$('examPill').textContent=`모의고사 ${q.exam}회`;$('questionNo').textContent=`${idx+1} / ${filtered.length}`;$('position').textContent=`${q.exam}회 · ${q.num}번`; $('qtext').textContent=q.question;if(activeId!==q.id){activeId=q.id;selected=responses[q.id]?.choice??null;showAnswer=!!responses[q.id]?.checked;}$('options').innerHTML='';q.options.forEach((op,i)=>{let b=document.createElement('button');b.className='opt';if(selected===i)b.classList.add('selected');if(showAnswer&&q.answer===i)b.classList.add('correct');if(showAnswer&&selected===i&&selected!==q.answer)b.classList.add('wrong');let num=document.createElement('span');num.className='num';num.textContent=letters[i];let t=document.createElement('span');t.textContent=op;b.append(num,t);b.onclick=()=>{if(showAnswer)return;selected=i;render()};$('options').appendChild(b)});$('feedback').className='feedback hidden';if(showAnswer){let fb=$('feedback');fb.className='feedback '+(selected===q.answer?'good':'bad');let answerText=q.answer==null?'정답표에서 정답을 확인하지 못했습니다.':`정답: ${letters[q.answer]} ${q.options[q.answer]}`;fb.textContent=(selected===q.answer?'정답이에요! ':'오답이에요. ')+answerText+' · 별도 해설은 제공되지 않아 원문 정답만 표시합니다.';} $('markBtn').textContent=wrongs.includes(q.id)?'★ 오답노트 저장됨':'☆ 오답노트 저장';$('progressbar').style.width=`${Math.round((idx+1)/filtered.length*100)}%`;}
function check(){let q=filtered[idx];if(!q)return;if(selected==null){alert('보기를 먼저 선택해 주세요.');return}responses[q.id]={choice:selected,checked:true};if(q.answer!=null&&selected!==q.answer){if(!wrongs.includes(q.id))wrongs.push(q.id)}else if(q.answer!=null&&selected===q.answer){wrongs=wrongs.filter(id=>id!==q.id)}save();showAnswer=true;render()}
function next(){if(idx<filtered.length-1){idx++;render()}else alert('현재 목록의 마지막 문제예요.')}function prev(){if(idx>0){idx--;render()}}
function toggleWrong(){let q=filtered[idx];if(!q)return;if(wrongs.includes(q.id))wrongs=wrongs.filter(id=>id!==q.id);else wrongs.push(q.id);save();render()}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));$('quizView').classList.toggle('hidden',v!=='quiz');$('wrongView').classList.toggle('hidden',v!=='wrong');$('resultsView').classList.toggle('hidden',v!=='results');if(v==='wrong')renderWrongs();if(v==='results')renderResults()}
function renderWrongs(){let box=$('wrongView');if(!wrongs.length){box.innerHTML='<div class="empty">아직 오답노트가 비어 있어요.<br>문제를 풀고 틀린 문제를 저장해 주세요.</div>';return}box.innerHTML='<h2 style="margin:0 0 6px">오답노트</h2><p class="sub">틀린 문제만 모아 다시 풀 수 있어요.</p><button class="btn primary" id="redoWrong">틀린 문제 다시 풀기</button><button class="btn soft" id="clearWrong" style="margin-left:6px">오답노트 비우기</button><div id="wrongList"></div>';let list=$('wrongList');wrongs.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean).forEach(q=>{let d=document.createElement('div');d.className='listitem';let h=document.createElement('h3');h.textContent=`${q.exam}회 ${q.num}번 · ${q.question}`;let p=document.createElement('p');p.className='mini';p.textContent=`내 답: ${responses[q.id]?letters[responses[q.id].choice]:'미응답'} / 정답: ${q.answer==null?'미확인':letters[q.answer]}`;let b=document.createElement('button');b.className='btn soft';b.textContent='이 문제 다시 풀기';b.onclick=()=>{ $('exam').value=String(q.exam);$('mode').value='wrong';setView('quiz');buildList();idx=filtered.findIndex(x=>x.id===q.id);render()};d.append(h,p,b);list.appendChild(d)});$('redoWrong').onclick=()=>{$('exam').value='all';$('mode').value='wrong';shuffled=false;setView('quiz');idx=0;buildList()};$('clearWrong').onclick=()=>{if(confirm('오답노트를 모두 비울까요?')){wrongs=[];save();renderWrongs()}}}
function renderResults(){let done=Object.entries(responses);let correct=done.filter(([id,r])=>{let q=QUESTIONS.find(x=>x.id===id);return q&&q.answer===r.choice&&r.checked}).length;let total=done.filter(([id,r])=>r.checked).length;$('resultsView').innerHTML=`<h2 style="margin-top:0">풀이 기록</h2><div class="stats"><div class="stat"><b>${total}</b>정답 확인한 문제</div><div class="stat"><b>${correct}</b>맞힌 문제</div><div class="stat"><b>${total?Math.round(correct/total*100):0}%</b>정답률</div></div><div class="listitem"><p>회차별 문제 수: 1회 ${QUESTIONS.filter(q=>q.exam===1).length}개 · 2회 ${QUESTIONS.filter(q=>q.exam===2).length}개 · 3회 ${QUESTIONS.filter(q=>q.exam===3).length}개</p><button class="btn soft" id="resetProgress">풀이 기록 초기화</button></div>`;$('resetProgress').onclick=()=>{if(confirm('풀이 기록을 초기화할까요? 오답노트도 함께 지워집니다.')){responses={};wrongs=[];save();renderResults();buildList()}}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.view));$('exam').onchange=()=>{idx=0;shuffled=false;buildList()};$('mode').onchange=()=>{idx=0;buildList()};$('checkBtn').onclick=check;$('nextBtn').onclick=next;$('prevBtn').onclick=prev;$('markBtn').onclick=toggleWrong;$('shuffleBtn').onclick=()=>{shuffled=!shuffled;idx=0;buildList();$('shuffleBtn').textContent=shuffled?'원래 순서로':'문제 순서 섞기'};$('examStartBtn').onclick=()=>{setView('quiz');$('mode').value='all';idx=0;shuffled=false;buildList()};updateStats();buildList();
</script></body></html>
